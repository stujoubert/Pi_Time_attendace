# Nginx config for Attendance System
# Copy to: /etc/nginx/sites-available/attendance
# Enable: sudo ln -sf /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 192.168.0.22 attendance.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.0.22 attendance.local;

    ssl_certificate     /etc/ssl/certs/attendance.crt;
    ssl_certificate_key /etc/ssl/private/attendance.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Serve PWA static files directly (no symlinks needed)
    location /static/icon-192.png { alias /opt/attendance/static/icon-192.png; }
    location /static/icon-512.png { alias /opt/attendance/static/icon-512.png; }
    location /static/manifest.json { alias /opt/attendance/static/manifest.json; }
    location /static/sw.js { alias /opt/attendance/static/sw.js; }

    # Everything else (including uploads) proxied to Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
