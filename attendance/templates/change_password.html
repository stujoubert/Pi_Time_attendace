{% extends "layout.html" %}
{% block page_title %}{{ T.hol_change_password if T.hol_change_password else 'Change Password' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <div class="card-title" style="margin-bottom:14px;">{{ T.hol_change_password if T.hol_change_password else 'Change Password' }}</div>
  <form method="post" action="{{ url_for('holidays.change_password') }}">
    <div class="form-row" style="margin-bottom:10px;">
      <label class="form-label">{{ T.hol_current_pw if T.hol_current_pw else 'Current password' }}</label>
      <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
    </div>
    <div class="form-row" style="margin-bottom:10px;">
      <label class="form-label">{{ T.hol_new_pw if T.hol_new_pw else 'New password' }}</label>
      <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-row" style="margin-bottom:14px;">
      <label class="form-label">{{ T.hol_confirm_pw if T.hol_confirm_pw else 'Confirm new password' }}</label>
      <input type="password" name="confirm_password" class="form-control" required minlength="6" autocomplete="new-password">
    </div>
    <button class="btn" type="submit" style="width:100%;">
      <i class="bi bi-key"></i> {{ T.hol_update_pw if T.hol_update_pw else 'Update password' }}
    </button>
  </form>
</div>
{% endblock %}
